function resizeImg(file,size,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas"),s=Math.min(im.width,im.height);c.width=c.height=size;c.getContext("2d").drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,size,size);cb(c.toDataURL("image/jpeg",.8))};im.onerror=()=>toast("Imagem inválida");im.src=r.result};r.readAsDataURL(file)}
document.addEventListener("change",e=>{const t=e.target;
if(t.id=="pf"&&t.files[0])resizeImg(t.files[0],256,d=>{S.p.photo=d;P.ph=0;save();render();toast("Foto atualizada")});
else if(t.id=="lcf"&&t.files[0])resizeImg(t.files[0],400,d=>{D.cv=d;render()});
else if(t.dataset.d=="rk"){D.rk=t.checked;render()}else if(t.dataset.p=="ws"){P.ws=t.value;render()}});
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(!t)return;const a=t.dataset.a,id=t.dataset.id,i=+t.dataset.i,g=x=>document.getElementById(x),mv=(arr,n,d)=>{const j=n+d;if(j>=0&&j<arr.length)[arr[n],arr[j]]=[arr[j],arr[n]]};
if(a=="ptab"){P.tab=id;render()}
else if(a=="pset"){P.set=t.tagName=="A"?1:!P.set;P.menu=0;render()}
else if(a=="pmenu"){P.menu=!P.menu;render()}
else if(a=="crerun"){cat().forEach(x=>{if(C[x.id]&&C[x.id].s!="ok")delete C[x.id]});tried.clear();csave();cupd();cat().forEach(x=>{if(!C[x.id])CQ.push(x.id)});crun()}
else if(a=="pfav"){L.tab="favoritos";L.open=null;P.menu=0}
else if(a=="pph"){P.ph=!P.ph;render()}
else if(a=="prm"){S.p.photo="";P.ph=0;save();render();toast("Foto removida")}
else if(a=="psave"){S.p.name=g("pn").value.trim().slice(0,30)||"meu_usuario";S.p.cc=g("pc").value;P.set=0;save();render();toast("Perfil salvo")}
else if(a=="regt"){P.reg=!P.reg;render()}
else if(a=="hreg"){addListen(id,g("hd").value);save();render();toast("Audição registrada")}
else if(a=="listen"){addListen(id,g("ld").value);const c=g("lrm");if(c&&c.checked)delete U(id).w;save();render();toast("Audição registrada")}
else if(a=="esave"){const x=S.hist.find(z=>z.i==id);if(!x)return;const d=g("ed-"+id).value,r=parseFloat(g("er-"+id).value),v=g("ev-"+id).value.trim();
if(/^\d{4}-\d\d-\d\d$/.test(d))x.d=d>today()?today():d;if(okR(r))x.r=r;else delete x.r;if(v)x.v=v;else delete x.v;
const l=latest(x.a);if(l&&l.i==x.i){const u=U(x.a);if(x.r)u.r=x.r;else delete u.r}syncH(x.a);save();render();toast("Audição salva")}
else if(a=="edel"){const x=S.hist.find(z=>z.i==id);if(x&&confirm("Excluir esta audição?")){S.hist=S.hist.filter(z=>z.i!=id);syncH(x.a);save();render();toast("Audição excluída")}}
else if(a=="wrm"){delete U(id).w;save();render();toast("Removido de Quero ouvir")}
else if(a=="wheard"){addListen(id,today());delete U(id).w;save();render();toast("Registrado no histórico e removido de Quero ouvir")}
else if(a=="wup"||a=="wdn"){const o=wsorted();mv(o,o.indexOf(id),a=="wup"?-1:1);S.wo=o;save();render()}
else if(a=="dadd"){if(!D.ids.includes(id))D.ids.push(id);render()}
else if(a=="drm"){D.ids.splice(i,1);render()}
else if(a=="dup"||a=="ddn"){mv(D.ids,i,a=="dup"?-1:1);render()}
else if(a=="lcrm"){D.cv="";render()}
else if(a=="dsave"){const n=(D.n||"").trim();if(!n){toast("Dê um nome à lista");return}let l=D.id&&S.lists.find(x=>x.id===D.id);if(!l){l={id:"l"+Date.now()};S.lists.push(l)}
Object.assign(l,{n,d:(D.d||"").trim(),rk:!!D.rk,cv:D.cv,ids:[...D.ids]});const lid=l.id;D=null;save();toast("Lista salva");location.hash="lista-"+lid;render()}
else if(a=="pldel"){if(confirm("Excluir esta lista? Os álbuns continuam no catálogo.")){S.lists=S.lists.filter(x=>x.id!=id);P.tab="lists";save();toast("Lista excluída");location.hash="perfil";render()}}
else if(a=="plup"||a=="pldn"||a=="plrm"){const l=S.lists.find(x=>x.id==id);if(!l)return;if(a=="plrm")l.ids.splice(i,1);else mv(l.ids,i,a=="plup"?-1:1);save();render()}});

render();
cat().forEach(a=>{if(!C[a.id]||C[a.id].s=="fail")CQ.push(a.id)});crun();
</script></body></html>
